<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>How skills, workflows, and agents interlock in the Forge harness</title>
<desc>You type a command. Skills are playbooks that run in the main session; workflows are JS orchestrations outside the chat. Skills delegate to forge agents and fire workflows; workflows spawn agent fleets.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a887f"/></marker>
</defs>

<rect x="0" y="0" width="720" height="470" rx="10" fill="#faf9f5"/>

<rect x="240" y="14" width="240" height="52" rx="8" fill="#ffffff" stroke="#b0aea2"/>
<text x="360" y="36" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1e1d">You</text>
<text x="360" y="54" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#6e6d66">/command [arguments]</text>

<line x1="300" y1="66" x2="204" y2="128" stroke="#8a887f" marker-end="url(#arr)"/>
<text x="215" y="96" text-anchor="end" font-size="11" fill="#8a887f">type a skill</text>
<line x1="420" y1="66" x2="516" y2="128" stroke="#8a887f" marker-end="url(#arr)"/>
<text x="505" y="96" font-size="11" fill="#8a887f">type a workflow</text>

<rect x="48" y="132" width="300" height="130" rx="8" fill="#ffffff" stroke="#d1cfc5"/>
<text x="64" y="156" font-size="14" font-weight="600" fill="#1f1e1d">Skills — playbooks</text>
<text x="64" y="175" font-size="12" fill="#6e6d66">Markdown, run in the main session</text>
<text x="64" y="200" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#1f1e1d">kickoff · adopt · feature · forge</text>
<text x="64" y="218" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#1f1e1d">fix · harden · ship · debug-hard</text>
<text x="64" y="236" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#1f1e1d">status · retro</text>
<text x="64" y="254" font-size="11" fill="#8a887f">pause at gates for your approval</text>

<rect x="372" y="132" width="300" height="130" rx="8" fill="#ffffff" stroke="#d1cfc5"/>
<text x="388" y="156" font-size="14" font-weight="600" fill="#1f1e1d">Workflows — orchestration</text>
<text x="388" y="175" font-size="12" fill="#6e6d66">JS scripts, run outside the chat</text>
<text x="388" y="200" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#1f1e1d">understand · design-panel</text>
<text x="388" y="218" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#1f1e1d">feature-pipeline · deep-review</text>
<text x="388" y="236" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#1f1e1d">release-gate</text>
<text x="388" y="254" font-size="11" fill="#8a887f">deterministic, 5–30x tokens</text>

<line x1="348" y1="197" x2="372" y2="197" stroke="#8a887f" marker-end="url(#arr)"/>
<text x="360" y="188" text-anchor="middle" font-size="11" fill="#8a887f">fires</text>

<line x1="198" y1="262" x2="298" y2="322" stroke="#8a887f" marker-end="url(#arr)"/>
<text x="230" y="292" text-anchor="end" font-size="11" fill="#8a887f">delegates one-off</text>
<line x1="522" y1="262" x2="422" y2="322" stroke="#8a887f" marker-end="url(#arr)"/>
<text x="492" y="292" font-size="11" fill="#8a887f">spawns a fleet</text>

<rect x="160" y="326" width="400" height="118" rx="8" fill="#f0eee6" stroke="#d1cfc5"/>
<text x="176" y="350" font-size="14" font-weight="600" fill="#1f1e1d">forge agents — specialists</text>
<text x="176" y="369" font-size="12" fill="#6e6d66">fresh context, pinned model, own tools</text>
<text x="176" y="394" font-size="12" fill="#1f1e1d"><tspan font-weight="600">Session</tspan>  blueprint (plan) · quench (review) · temper (debug)</text>
<text x="176" y="412" font-size="12" fill="#1f1e1d"><tspan font-weight="600">Opus 4.8</tspan>  hammer (build) · proof (test) · warden (security)</text>
<text x="176" y="430" font-size="12" fill="#1f1e1d"><tspan font-weight="600">Sonnet 5</tspan>  prospector (research) · etcher (docs)</text>
</svg>
